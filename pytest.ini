[pytest]
# テスト（ロジックのテストと守りのテスト）は tests/ だけ。spikes/ の中の試作のテストは集めない。
# 回すときは tools/test.py を通す（0件、スキップ、-k の打ち間違いを失敗にするため）。
testpaths = tests
norecursedirs = spikes out dist .cache .git
addopts = -p no:cacheprovider --strict-markers --strict-config
xfail_strict = true
# スレッドの中だけで起きた例外と、片付けの中の例外を失敗にする。
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
